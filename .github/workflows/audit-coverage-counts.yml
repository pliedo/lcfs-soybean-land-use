name: Audit existing coverage class counts
on:
  workflow_dispatch:
  push:
    paths:
      - 'code/48_audit_coverage_class_counts.py'
      - '.github/workflows/audit-coverage-counts.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: python code/48_audit_coverage_class_counts.py
      - name: Commit diagnostic only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f output/diagnostics/coverage_2024_2025_class_count_audit.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit existing class counts explaining coverage changes'
          git pull --rebase origin main
          git push origin main
