name: Extend CDL outcomes through 2025

on:
  workflow_dispatch:
  push:
    paths:
      - "code/22_extract_cdl_2025.py"
      - ".github/workflows/extend-cdl-2025.yml"

permissions:
  contents: write

concurrency:
  group: cdl-2025-extension
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sf
            any::dplyr
            any::readxl
            any::readr
            any::stringr
            any::units
            any::jsonlite
      - name: Build true exclusive ring polygons
        run: Rscript code/02_build_spatial_zones.R
      - id: matrix
        name: Build candidate-hub matrix
        run: |
          value="$(Rscript -e 'd <- read.csv("data/clean/candidate_hubs_clean.csv"); ids <- d$hub_id[d$hub_status == "candidate_hub"]; cat(jsonlite::toJSON(list(include = unlist(lapply(c(1,3,5), function(r) lapply(ids, function(i) list(hub = as.character(i), ring = as.character(r)))), recursive = FALSE)), auto_unbox = TRUE))')"
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install geopandas rasterio numpy
      - name: Validate 2025 endpoint and exact polygon extraction before launching batches
        run: python code/22_extract_cdl_2025.py --hub 1 --ring 1 --years 2025
      - uses: actions/upload-artifact@v4
        with:
          name: exclusive-ring-polygons
          path: output/facility_rings_exclusive.gpkg

  extract:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: exclusive-ring-polygons
          path: output
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install raster dependencies
        run: pip install geopandas rasterio numpy
      - name: Extract 2025 for two consecutive distance bands
        run: |
          for ring in ${{ matrix.ring }} $(( ${{ matrix.ring }} + 1 )); do
            python code/22_extract_cdl_2025.py --hub ${{ matrix.hub }} --ring "$ring" --years 2025 || exit $?
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cdl2025-hub-${{ matrix.hub }}-pair-${{ matrix.ring }}
          path: batch-results-2025/

  merge:
    needs: [prepare, extract]
    if: ${{ needs.extract.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: cdl2025-hub-*
          path: batch-results-2025
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install merge dependencies
        run: pip install pandas
      - name: Validate and append all six 2025 bands
        run: |
          python - <<'PY'
          import glob,os,pandas as pd
          for filename,target in [('crop_outcomes.csv','crop_outcomes_exclusive.csv'),('cdl_class_composition.csv','cdl_class_composition_exclusive.csv')]:
              files=glob.glob('batch-results-2025/**/'+filename,recursive=True)
              assert len(files)==348, f'Expected 348 hub-band outputs; got {len(files)}'
              x=pd.concat([pd.read_csv(p) for p in files],ignore_index=True)
              if filename=='crop_outcomes.csv':
                  assert len(x)==348 and x.hub_id.nunique()==58
                  assert set(x.year)=={2025} and set(x.ring_index)==set(range(1,7))
                  assert not x.duplicated(['hub_id','year','ring_index']).any()
                  assert (x.groupby('ring_index').hub_id.nunique()==58).all()
                  outcomes=x.copy()
              else:
                  assert not x.duplicated(['hub_id','year','ring_index','cdl_code']).any()
                  valid=x[x.cdl_code!=0].groupby(['hub_id','year','ring_index']).pixel_count.sum()
                  totals=outcomes.set_index(['hub_id','year','ring_index']).all_valid_pixels
                  assert valid.reindex(totals.index,fill_value=0).equals(totals)
              path='data/clean/'+target
              old=pd.read_csv(path)
              x=pd.concat([old[old.year!=2025],x],ignore_index=True)
              x.sort_values(['hub_id','year','ring_index']).to_csv(path,index=False)
          PY
      - name: Commit verified 2025 extension
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/clean/crop_outcomes_exclusive.csv data/clean/cdl_class_composition_exclusive.csv
          git diff --cached --quiet || git commit -m "Add 2025 CDL outcomes and composition for all six bands"
          git pull --rebase origin main
          git push origin HEAD:main
