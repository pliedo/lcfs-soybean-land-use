name: Build conceptual presentation figures
on:
  workflow_dispatch:
  push:
    paths:
      - code/09_build_conceptual_figures.py
      - .github/workflows/build-conceptual-figures.yml
permissions:
  contents: write
jobs:
  figures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy matplotlib
      - run: python code/09_build_conceptual_figures.py
      - name: Commit figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/figures/conceptual
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add conceptual presentation figures"
          git pull --rebase origin main
          git push origin HEAD:main
