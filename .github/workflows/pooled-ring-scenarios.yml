name: Estimate pooled ring capacity scenarios
on:
  workflow_dispatch:
  push:
    paths:
      - 'code/40_pooled_ring_capacity_scenarios.py'
      - '.github/workflows/pooled-ring-scenarios.yml'
permissions:
  contents: write
jobs:
  estimate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scipy
      - run: OPENBLAS_NUM_THREADS=1 python code/40_pooled_ring_capacity_scenarios.py
      - name: Commit scenario outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/tables/pooled*.csv output/tables/pooled*.csv.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update pooled ring responses and cumulative capacity scenarios'
          git pull --rebase origin main
          git push origin main
