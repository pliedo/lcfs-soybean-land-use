name: Non-water soybean shares and timing checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'code/49_build_nonwater_outcomes.py'
      - 'code/50_estimate_nonwater_dose.py'
      - '.github/workflows/nonwater-outcomes.yml'
permissions:
  contents: write
jobs:
  estimate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scipy
      - run: python code/49_build_nonwater_outcomes.py
      - run: OPENBLAS_NUM_THREADS=1 python code/50_estimate_nonwater_dose.py
      - name: Commit new outcomes and checks only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/clean/crop_outcomes_nonwater_exclusive.csv output/diagnostics/nonwater_denominator_audit.csv output/tables/nonwater_dose*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add non-water soybean outcomes and baseline-weight timing estimates'
          git pull --rebase origin main
          git push origin main
