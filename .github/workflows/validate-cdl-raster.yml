name: Validate CDL raster extraction

on:
  workflow_dispatch:
  push:
    paths:
      - "code/06_validate_cdl_raster.py"
      - ".github/workflows/validate-cdl-raster.yml"

permissions:
  contents: write

jobs:
  validate-hub-1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sf
            any::dplyr
            any::readxl
            any::readr
            any::stringr
            any::units
      - name: Build true exclusive rings
        run: Rscript code/02_build_spatial_zones.R
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install raster dependencies
        run: pip install geopandas rasterio numpy
      - name: Validate Hub 1 0-25 mile ring from official CDL raster
        run: python code/06_validate_cdl_raster.py
      - name: Upload raster validation
        uses: actions/upload-artifact@v4
        with:
          name: cdl-raster-validation
          path: output/diagnostics/cdl_raster_validation_hub1_2023.csv
      - name: Commit validation result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/diagnostics/cdl_raster_validation_hub1_2023.csv
          git diff --cached --quiet || git commit -m "Validate CDL raster extraction"
          git push
