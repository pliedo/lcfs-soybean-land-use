name: Transport exposure regressions through 2025
on:
  push:
    paths:
      - "code/26_transport_exposure_regressions.py"
      - ".github/workflows/transport-regressions.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  estimate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas scipy matplotlib openpyxl
      - run: python -u code/26_transport_exposure_regressions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transport-regression-results
          path: |
            output/tables/transport_dose*.csv
            output/figures/results/transport_exposure_sensitivity_2025.*
      - name: Commit complete results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/tables/transport_dose*.csv output/figures/results/transport_exposure_sensitivity_2025.* data/clean/refinery_crusher_transport_weights.csv data/clean/crusher_year_transport_exposure.csv
          git diff --cached --quiet || git commit -m "Add complete transport exposure regression sensitivity grid"
          git pull --rebase origin main
          git push origin HEAD:main
