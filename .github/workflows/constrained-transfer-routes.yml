name: Build constrained feedstock transfer alternatives
on:
  push:
    paths:
      - code/31_add_constrained_transfer_routes.py
      - .github/workflows/constrained-transfer-routes.yml
permissions:
  contents: write
jobs:
  routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas scipy openpyxl searoute==1.4.3
      - uses: actions/cache@v4
        with:
          path: data/raw/network_cache
          key: transport-network-2026-rail-2025-water-v1
      - run: python code/31_add_constrained_transfer_routes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: constrained-route-checkpoint
          path: |
            data/clean/documented_intermediate_route_proxies.csv
            output/diagnostics/intermediate_route_validation.json
      - name: Commit preserved feedstock-route alternatives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/clean/documented_intermediate_route_proxies.csv data/clean/inferred_liquid_bulk_terminal_sources.csv data/clean/pathway_transport_leg_audit_reviewed.csv output/diagnostics/intermediate_route_validation.json
          git diff --cached --quiet || git commit -m "Preserve Illinois rail-barge and Artesia pretreatment route alternatives"
          git pull --rebase origin main
          git push origin HEAD:main
