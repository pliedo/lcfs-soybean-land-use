name: Transport matrix sensitivity
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  estimate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scipy matplotlib
      - run: python code/44_transport_matrix_sensitivity.py
      - run: OPENBLAS_NUM_THREADS=1 python code/45_estimate_transport_matrix_sensitivity.py
      - run: python code/46_summarize_matrix_sensitivity.py
      - name: Commit sensitivity outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/clean/transport_matrix_sensitivity_candidates.csv.gz output/tables/transport_matrix_sensitivity* output/figures/results/transport_matrix_sensitivity_75mile.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update transport matrix sensitivity estimates'
          git pull --rebase origin main
          git push origin main
