name: Publish completed sensitivity artifacts
on:
  workflow_dispatch:
  push:
    paths:
      - 'output/publish_sensitivity_parts/manifest.json'
      - 'code/47_restore_sensitivity_outputs.py'
      - '.github/workflows/publish-sensitivity-artifacts.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Assemble existing results and verify hashes
        run: python code/47_restore_sensitivity_outputs.py
      - name: Commit verified artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/tables/transport_matrix_sensitivity_coefficients.csv.gz output/tables/transport_matrix_sensitivity_scenarios.csv.gz output/tables/transport_matrix_sensitivity_average_summary.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified existing sensitivity results; no model recomputation'
          git pull --rebase origin main
          git push origin main
