name: Audit route-specific oil transport components
on:
  push:
    paths:
      - "code/27_build_route_cost_components.py"
      - ".github/workflows/route-cost-components.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - run: python code/27_build_route_cost_components.py
      - name: Commit auditable components
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/clean/pathway_transport_leg_audit.csv data/clean/refinery_crusher_route_cost_components.csv
          git diff --cached --quiet || git commit -m "Add route-specific oil transport evidence and incomplete cost components"
          git pull --rebase origin main
          git push origin HEAD:main
