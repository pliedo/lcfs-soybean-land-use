name: Recover and merge 2025 CDL batch v7

on:
  push:
    paths:
      - ".github/workflows/recover-cdl-2025.yml"

permissions:
  actions: read
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: exclusive-ring-polygons
          path: output
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38081697675
      - name: Download all prior batch artifacts with pagination
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p batch-results-2025
          gh api --paginate \
            "/repos/pliedo/lcfs-soybean-land-use/actions/runs/38081697675/artifacts?per_page=100" \
            --slurp > /tmp/cdl-artifact-pages.json
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          pages = json.load(open("/tmp/cdl-artifact-pages.json"))
          artifacts = [
              artifact
              for page in pages
              for artifact in page["artifacts"]
              if artifact["name"].startswith("cdl2025-hub-")
          ]
          assert len(artifacts) == 173, f"Expected 173 prior artifacts; got {len(artifacts)}"

          root = pathlib.Path("batch-results-2025")
          zip_path = pathlib.Path("/tmp/cdl-artifact.zip")
          for artifact in artifacts:
              destination = root / artifact["name"]
              destination.mkdir(parents=True, exist_ok=True)
              with zip_path.open("wb") as archive:
                  subprocess.run(
                      [
                          "gh",
                          "api",
                          f"/repos/pliedo/lcfs-soybean-land-use/actions/artifacts/{artifact['id']}/zip",
                      ],
                      check=True,
                      stdout=archive,
                  )
              subprocess.run(
                  ["unzip", "-oq", str(zip_path), "-d", str(destination)],
                  check=True,
              )
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install geopandas rasterio numpy pandas
      - name: Download official Census CONUS boundary
        run: |
          mkdir -p data/raw
          curl --fail --location --retry 4 --retry-delay 3 \
            -o data/raw/cb_2024_us_state_500k.zip \
            https://www2.census.gov/geo/tiger/GENZ2024/shp/cb_2024_us_state_500k.zip
      - name: Recover only failed hub 25 outer pair
        run: |
          python code/22_extract_cdl_2025.py --hub 25 --ring 5 --years 2025
          python code/22_extract_cdl_2025.py --hub 25 --ring 6 --years 2025
      - name: Validate and append all 2025 bands
        run: |
          python - <<'PY'
          import glob,pandas as pd
          for filename,target in [('crop_outcomes.csv','crop_outcomes_exclusive.csv'),('cdl_class_composition.csv','cdl_class_composition_exclusive.csv')]:
              files=glob.glob('batch-results-2025/**/'+filename,recursive=True)
              assert len(files)==348, f'Expected 348 hub-band outputs; got {len(files)}'
              x=pd.concat([pd.read_csv(p) for p in files],ignore_index=True)
              if filename=='crop_outcomes.csv':
                  assert len(x)==348 and x.hub_id.nunique()==58
                  assert set(x.year)=={2025} and set(x.ring_index)==set(range(1,7))
                  assert not x.duplicated(['hub_id','year','ring_index']).any()
                  assert (x.groupby('ring_index').hub_id.nunique()==58).all()
                  outcomes=x.copy()
              else:
                  assert not x.duplicated(['hub_id','year','ring_index','cdl_code']).any()
                  valid=x[x.cdl_code!=0].groupby(['hub_id','year','ring_index']).pixel_count.sum()
                  totals=outcomes.set_index(['hub_id','year','ring_index']).all_valid_pixels
                  observed=valid.reindex(totals.index,fill_value=0).astype('int64')
                  expected=totals.astype('int64')
                  difference=observed-expected
                  assert (difference==0).all(), (
                      f'Pixel-count mismatch in {(difference!=0).sum()} hub-rings; '
                      f'max absolute difference {difference.abs().max()}'
                  )
              path='data/clean/'+target
              old=pd.read_csv(path)
              x=pd.concat([old[old.year!=2025],x],ignore_index=True)
              x.sort_values(['hub_id','year','ring_index']).to_csv(path,index=False)
          PY
      - name: Commit verified 2025 extension
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/clean/crop_outcomes_exclusive.csv data/clean/cdl_class_composition_exclusive.csv
          git diff --cached --quiet || git commit -m "Add verified 2025 CDL outcomes for all six bands"
          git pull --rebase origin main
          git push origin HEAD:main
