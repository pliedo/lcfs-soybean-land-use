name: Summarize candidate route cost evidence
on:
  workflow_run:
    workflows: ["Estimate complete-pair route cost exposure grid"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: summarize-route-cost
  cancel-in-progress: false
jobs:
  summarize:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas matplotlib tabulate
      - run: python code/36_summarize_complete_route_results.py
      - name: Commit figures and evidence report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/tables/complete_route_cost_coefficient_inventory.csv output/tables/complete_route_cost_focal_coefficient_table.csv output/figures/results/complete_route_cost_focal* doc/complete-route-cost-evidence-report.md
          git diff --cached --quiet || git commit -m "Add 16:9 coefficient figures and all-sign evidence report"
          git pull --rebase origin main
          git push origin HEAD:main
